<div class="sidebar">
  <div class="logo">
    <div class="logo-icon">S</div>
    <span class="logo-text">SBC</span>
  </div>

  <label class="search-box">
    <span class="search-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" class="icon-svg">
        <circle cx="11" cy="11" r="6"></circle>
        <path d="M20 20l-4.2-4.2"></path>
      </svg>
    </span>
    <input
      type="text"
      placeholder="Search"
      [(ngModel)]="searchTerm"
      (input)="onSearchInput()"
      (keydown.enter)="onSearchSubmit()"
      (focus)="onSearchFocus()"
      (blur)="onSearchBlur()"
    />

    <ul class="search-suggestions" *ngIf="showSuggestions">
      <li *ngFor="let suggestion of suggestions" (mousedown)="selectSuggestion(suggestion)">
        <strong>{{ suggestion.title }}</strong>
        <span>{{ suggestion.subtitle }}</span>
      </li>
    </ul>
  </label>

  <ul class="menu">
    <li [class.active]="isActive('dashboard')" routerLink="/admin/dashboard" (click)="onNavItemClick()">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="icon-svg">
          <path d="M4 11l8-7 8 7"></path>
          <path d="M6 10v10h12V10"></path>
        </svg>
      </span>
      <span>Dashboard</span>
    </li>
    <li [class.active]="isActive('clients')" routerLink="/admin/clients" (click)="onNavItemClick()">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="icon-svg">
          <circle cx="8" cy="9" r="3"></circle>
          <circle cx="16.5" cy="8.5" r="2.5"></circle>
          <path d="M3.5 19c.8-2.7 2.8-4 5.5-4s4.7 1.3 5.5 4"></path>
          <path d="M14 18c.6-1.8 2-2.8 3.9-2.8 1.1 0 2 .3 2.8.9"></path>
        </svg>
      </span>
      <span>Clients</span>
    </li>
    <li [class.active]="isActive('engagements')" routerLink="/admin/engagements" (click)="onNavItemClick()">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="icon-svg">
          <rect x="4" y="6" width="16" height="12" rx="2"></rect>
          <path d="M8 10h8M8 14h5"></path>
        </svg>
      </span>
      <span>Engagements</span>
    </li>
    <li [class.active]="isActive('reports')" routerLink="/admin/reports" (click)="onNavItemClick()">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="icon-svg">
          <path d="M7 4h7l4 4v12H7z"></path>
          <path d="M14 4v4h4M10 12h5M10 16h5"></path>
        </svg>
      </span>
      <span>Reports</span>
    </li>
    <li
      *ngIf="sessionService.canManageUsers()"
      [class.active]="isActive('users')"
      routerLink="/admin/users"
      (click)="onNavItemClick()"
    >
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="icon-svg">
          <circle cx="12" cy="8" r="3"></circle>
          <path d="M5 19c1.1-3 3.5-4.5 7-4.5s5.9 1.5 7 4.5"></path>
        </svg>
      </span>
      <span>User Management</span>
    </li>
  </ul>

  <div class="bottom-section">
    <button class="settings" type="button">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="icon-svg">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.3.9a7.2 7.2 0 0 0-1.7-1l-.3-2.4h-4l-.3 2.4a7.2 7.2 0 0 0-1.7 1l-2.3-.9-2 3.5 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.5 2.3-.9a7.2 7.2 0 0 0 1.7 1l.3 2.4h4l.3-2.4a7.2 7.2 0 0 0 1.7-1l2.3.9 2-3.5-2-1.5c.1-.3.1-.7.1-1z"></path>
        </svg>
      </span>
      <span>Settings</span>
    </button>

    <div class="profile">
      <div class="avatar">{{ sessionService.getCurrentUser().name.slice(0, 1) }}</div>
      <div class="profile-info">
        <span class="name">{{ sessionService.getCurrentUser().name }}</span>
        <span class="email">{{ sessionService.getCurrentUser().role }}</span>
      </div>
      <button type="button" class="logout-btn logout-icon" (click)="logout()" aria-label="Logout">
        <svg viewBox="0 0 24 24" class="icon-svg">
          <path d="M10 17l5-5-5-5"></path>
          <path d="M14 12H4"></path>
          <path d="M20 5v14"></path>
        </svg>
      </button>
    </div>
  </div>
</div>
